name: Release to npm
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*', 'scim-core-v[0-9]*']

permissions:
  contents: read

jobs:
  prepare:
    # A manual run on main prepares the archives for review or first-time publication.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      packages: ${{ steps.pack.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a protected release tag on main
        if: github.event_name == 'push'
        run: |
          if [[ "$GITHUB_REF_PROTECTED" != true ]]; then
            echo "::error::Protect v* and scim-core-v* release tags with a GitHub tag ruleset."
            exit 1
          fi
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - uses: ./.github/actions/verify
      - name: Pack and check the public packages
        id: pack
        run: |
          out="$RUNNER_TEMP/npm-tarballs"
          mkdir -p "$out"
          version() { node -p "require('./packages/$1/package.json').version"; }
          # A vX.Y.Z tag releases core and react. A scim-core-vX.Y.Z tag releases scim-core.
          # A manual run checks both sets at their current versions.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF_NAME" == v* ]]; then
            pnpm --filter @lpshanley/oidc-start-core pack --pack-destination "$out"
            pnpm --filter @lpshanley/oidc-start-react pack --pack-destination "$out"
            tag="$GITHUB_REF_NAME"
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && tag="v$(version core)"
            node scripts/npm-release.mjs check "$tag" "$out"
            echo 'packages=["core","react"]' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$GITHUB_REF_NAME" == scim-core-v* ]]; then
            pnpm --filter @lpshanley/scim-core pack --pack-destination "$out"
            tag="$GITHUB_REF_NAME"
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && tag="scim-core-v$(version scim-core)"
            node scripts/npm-release.mjs check "$tag" "$out"
            [[ "$GITHUB_EVENT_NAME" == push ]] && echo 'packages=["scim-core"]' >> "$GITHUB_OUTPUT"
          fi
      - name: Test the packed libraries in Chromium
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
        run: |
          pnpm --filter oidc-start-example exec playwright install --with-deps chromium
          bash scripts/check-packed-browser.sh "$RUNNER_TEMP/npm-tarballs"
      - name: Save verified tarballs
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/npm-tarballs/*.tgz
          if-no-files-found: error

  stage:
    if: github.event_name == 'push'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-stage-${{ matrix.package }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/npm-tarballs
      - name: Stage verified tarball for npm maintainer approval
        env:
          PACKAGE: ${{ matrix.package }}
        run: node scripts/npm-release.mjs stage "$GITHUB_REF_NAME" "$RUNNER_TEMP/npm-tarballs" "$PACKAGE"
